name: roger
description: Async video messaging for people you actually talk to.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^14.8.1
  drift: ^2.32.0
  sqlite3: ^3.3.1
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.8.4
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  intl_phone_number_input: ^0.7.5
  flutter_native_contact_picker: ^0.0.12
  share_plus: ^12.0.2
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.32.0
  mocktail: ^1.0.4

# Compile sqlite3 as SQLite3MultipleCiphers (sqlite3mc), which provides
# encryption-at-rest natively. `PRAGMA key` is honored. This is the v3-era
# replacement for the EOL sqlcipher_flutter_libs package; prebuilt binaries
# ship for all architectures including x86_64 Android emulator.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
