name: roger
description: Async video messaging for people you actually talk to.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.23.1
  sqlcipher_flutter_libs: 0.7.0+eol
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.8.4
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  drift_dev: ^2.23.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
